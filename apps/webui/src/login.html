<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Craft Agents — Login</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#1F1F24" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: #f8f8fa;
      --page-fg: #1a1a2e;
      --card-bg: rgba(255, 255, 255, 0.86);
      --card-border: rgba(228, 228, 232, 0.9);
      --card-shadow: 0 32px 96px rgba(41, 25, 63, 0.14), 0 16px 40px rgba(41, 25, 63, 0.08);
      --subtitle: rgba(26, 26, 46, 0.56);
      --input-bg: rgba(255, 255, 255, 0.72);
      --input-border: rgba(212, 212, 216, 0.95);
      --placeholder: rgba(26, 26, 46, 0.34);
      --accent: #6d5dfc;
      --accent-hover: #5a4be0;
      --ambient-strong: rgba(104, 78, 133, 0.18);
      --ambient-soft: rgba(104, 78, 133, 0.1);
      --grain-1: rgba(104, 78, 133, 0.055);
      --grain-2: rgba(104, 78, 133, 0.03);
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-fg: #b91c1c;
      --divider: rgba(26, 26, 46, 0.12);
      --google-btn-bg: #ffffff;
      --google-btn-border: rgba(212, 212, 216, 0.95);
      --google-btn-fg: #1a1a2e;
      --google-btn-hover: rgba(0, 0, 0, 0.04);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      background: var(--page-bg);
      color: var(--page-fg);
      padding: 16px;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      inset: -18%;
      background:
        radial-gradient(circle at 18% 20%, var(--ambient-strong) 0, transparent 34%),
        radial-gradient(circle at 82% 18%, var(--ambient-soft) 0, transparent 28%),
        radial-gradient(circle at 76% 76%, rgba(104, 78, 133, 0.16) 0, transparent 34%),
        radial-gradient(circle at 30% 78%, rgba(104, 78, 133, 0.11) 0, transparent 30%);
      filter: blur(44px);
      opacity: 0.95;
      transform: scale(1.08);
      animation: drift 24s ease-in-out infinite alternate;
    }

    body::after {
      background:
        radial-gradient(circle at center, rgba(104, 78, 133, 0.06), transparent 58%),
        repeating-linear-gradient(135deg, var(--grain-1) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(45deg, var(--grain-2) 0 1px, transparent 1px 11px);
      opacity: 0.45;
      mix-blend-mode: multiply;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 28rem;
      padding: 32px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      text-align: center;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 20rem;
      font-size: 13px;
      line-height: 1.5;
      color: var(--subtitle);
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--page-fg);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input::placeholder {
      color: var(--placeholder);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(109, 93, 252, 0.1);
    }

    .btn-primary {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      color: white;
      background: linear-gradient(180deg, #7b6dff 0%, var(--accent) 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, background 0.15s;
      box-shadow: 0 10px 24px rgba(109, 93, 252, 0.28);
    }

    .btn-primary:hover {
      background: linear-gradient(180deg, #705fff 0%, var(--accent-hover) 100%);
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      color: var(--google-btn-fg);
      background: var(--google-btn-bg);
      border: 1px solid var(--google-btn-border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
      text-decoration: none;
    }

    .google-btn:hover {
      background: var(--google-btn-hover);
      transform: translateY(-1px);
    }

    .google-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--subtitle);
      font-size: 12px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--divider);
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      font-size: 13px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      color: var(--error-fg);
    }

    .error.visible { display: block; }

    .hidden { display: none !important; }

    @keyframes drift {
      from { transform: scale(1.08) translate3d(-2%, -1%, 0); }
      to { transform: scale(1.12) translate3d(2%, 1.5%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }

      .btn-primary,
      .google-btn {
        transition: background 0.15s;
      }

      .btn-primary:hover,
      .google-btn:hover {
        transform: none;
        filter: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #0f0f14;
        --page-fg: #e0e0e8;
        --card-bg: rgba(26, 26, 34, 0.82);
        --card-border: rgba(42, 42, 53, 0.95);
        --card-shadow: 0 32px 96px rgba(0, 0, 0, 0.42), 0 16px 40px rgba(0, 0, 0, 0.24);
        --subtitle: rgba(224, 224, 232, 0.64);
        --input-bg: rgba(15, 15, 20, 0.72);
        --input-border: rgba(42, 42, 53, 0.95);
        --placeholder: rgba(224, 224, 232, 0.32);
        --ambient-strong: rgba(155, 123, 184, 0.22);
        --ambient-soft: rgba(155, 123, 184, 0.12);
        --grain-1: rgba(155, 123, 184, 0.06);
        --grain-2: rgba(155, 123, 184, 0.035);
        --error-bg: #2d1a1a;
        --error-border: #5a2020;
        --error-fg: #f5a0a0;
        --divider: rgba(224, 224, 232, 0.14);
        --google-btn-bg: rgba(26, 26, 34, 0.82);
        --google-btn-border: rgba(42, 42, 53, 0.95);
        --google-btn-fg: #e0e0e8;
        --google-btn-hover: rgba(255, 255, 255, 0.06);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Craft Agents</h1>
    <p class="subtitle" id="subtitle">Enter your server token to continue</p>

    <!-- Google Sign In -->
    <a href="/api/auth/google" class="google-btn" id="google-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </a>

    <!-- Divider -->
    <div class="divider hidden" id="divider">or</div>

    <!-- Password form -->
    <form id="login-form">
      <label for="password">Server Token</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter CRAFT_SERVER_TOKEN"
        autocomplete="current-password"
        autofocus
        required
      >
      <button type="submit" class="btn-primary" id="submit-btn">Sign In</button>
    </form>

    <div id="error" class="error"></div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');
    const googleBtn = document.getElementById('google-btn');
    const divider = document.getElementById('divider');
    const subtitle = document.getElementById('subtitle');

    // Detect available auth providers and adjust UI
    async function init() {
      try {
        const res = await fetch('/api/auth/providers');
        if (res.ok) {
          const providers = await res.json();
          if (providers.google && !providers.password) {
            // Google only — hide password form
            form.classList.add('hidden');
            divider.classList.add('hidden');
            subtitle.textContent = 'Sign in to continue';
          } else if (providers.google && providers.password) {
            // Both — show everything
            divider.classList.remove('hidden');
          } else if (!providers.google && providers.password) {
            // Password only — hide Google button
            googleBtn.classList.add('hidden');
            divider.classList.add('hidden');
          }
        }
      } catch {
        // Fallback: show password form, hide Google
        googleBtn.classList.add('hidden');
        divider.classList.add('hidden');
      }
    }

    init();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const password = document.getElementById('password').value;
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          // Cookie is set by the response — redirect to app
          window.location.href = '/';
          return;
        }

        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Authentication failed';
        errorEl.classList.add('visible');
      } catch (err) {
        errorEl.textContent = 'Network error — is the server running?';
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
